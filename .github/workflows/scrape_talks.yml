name: Scrape Talk Locations

on:
  workflow_dispatch:
  push:
    paths:
      - '_talks/**'
      - 'talkmap.py'
      - '.github/workflows/scrape_talks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install python-frontmatter getorg geopy

    - name: Regenerate talk map
      run: python talkmap.py

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add talkmap/
        git commit -m "Automated update of talk locations" || echo "No changes to commit"
        git push
